name: Amigos Broad Web Provider Probe

on:
  push:
    paths:
      - ".github/workflows/amigos-broad-web-provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe multiple no-key broad-web doors
        run: |
          set +e
          Q='Perth Australia salmon fishing May best bait'

          echo '=== MWMBL API ==='
          C=$(curl -L --max-time 20 -sS -o /tmp/mwmbl --get --data-urlencode "s=$Q" -w '%{http_code}' 'https://api.mwmbl.org/api/v1/search/')
          echo "STATUS=$C BYTES=$(wc -c </tmp/mwmbl)"
          head -c 700 /tmp/mwmbl | tr '\n' ' '; echo

          echo '=== MOJEEK HTML ==='
          C=$(curl -L --max-time 20 -sS -A 'Mozilla/5.0' -o /tmp/mojeek --get --data-urlencode "q=$Q" -w '%{http_code}' 'https://www.mojeek.com/search')
          echo "STATUS=$C BYTES=$(wc -c </tmp/mojeek)"
          grep -o -m 5 -E 'href="https?://[^"]+"' /tmp/mojeek | head -5

          echo '=== DUCKDUCKGO HTML ==='
          C=$(curl -L --max-time 20 -sS -A 'Mozilla/5.0' -o /tmp/ddg --get --data-urlencode "q=$Q" -w '%{http_code}' 'https://html.duckduckgo.com/html/')
          echo "STATUS=$C BYTES=$(wc -c </tmp/ddg)"
          grep -o -m 5 -E 'uddg=[^"&]+' /tmp/ddg | head -5

          echo '=== BING HTML ==='
          C=$(curl -L --max-time 20 -sS -A 'Mozilla/5.0' -o /tmp/bing --get --data-urlencode "q=$Q" -w '%{http_code}' 'https://www.bing.com/search')
          echo "STATUS=$C BYTES=$(wc -c </tmp/bing)"
          grep -o -m 5 -E '<li class="b_algo".{0,2000}' /tmp/bing | head -5
