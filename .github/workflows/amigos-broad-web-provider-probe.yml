name: Amigos Broad Web Provider Probe

on:
  push:
    paths:
      - ".github/workflows/amigos-broad-web-provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe SearXNG public doors
        run: |
          set +e
          Q='Perth Australia salmon fishing May best bait'
          for BASE in             'https://search.anoni.net'             'https://searx.oloke.xyz'             'https://searxng.cups.moe'             'https://priv.au'
          do
            echo "=== $BASE ==="
            URL="$BASE/search"
            CODE=$(curl -L --max-time 20 -sS -o /tmp/out --get               --data-urlencode "q=$Q"               --data-urlencode 'format=json'               -w '%{http_code}' "$URL")
            echo "JSON_STATUS=$CODE BYTES=$(wc -c </tmp/out)"
            head -c 500 /tmp/out | tr '\n' ' '; echo
            if [ "$CODE" != "200" ]; then
              CODE2=$(curl -L --max-time 20 -sS -o /tmp/out2 --get                 --data-urlencode "q=$Q"                 -w '%{http_code}' "$URL")
              echo "HTML_STATUS=$CODE2 BYTES=$(wc -c </tmp/out2)"
              grep -o -m 3 -E 'https?://[^"<> ]+' /tmp/out2 | head -3
            fi
          done
