name: Amigos Broad Web Provider Probe

on:
  push:
    paths:
      - ".github/workflows/amigos-broad-web-provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe no-key broad-web providers
        run: |
          set +e
          Q='Perth Western Australia salmon fishing May best bait'
          test_url() {
            NAME="$1"; URL="$2"
            CODE=$(curl -L --max-time 20 -A 'Mozilla/5.0 AndersonHouse/1.0' -sS -o /tmp/body -w '%{http_code}' "$URL")
            echo "=== $NAME HTTP=$CODE ==="
            head -c 1200 /tmp/body | tr '\n' ' '
            echo
          }

          test_url "SEARX_ANONI_JSON" "https://search.anoni.net/search?q=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$Q"'"))')&format=json"
          test_url "SEARX_FLOATING_JSON" "https://searx.thefloatinglab.world/search?q=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$Q"'"))')&format=json"
          test_url "SEARX_MBUF_JSON" "https://searx.mbuf.net/search?q=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$Q"'"))')&format=json"
          test_url "DUCKDUCKGO_HTML" "https://html.duckduckgo.com/html/?q=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$Q"'"))')"
          test_url "BING_RSS" "https://www.bing.com/search?q=$(python3 -c 'import urllib.parse; print(urllib.parse.quote("'"$Q"'"))')&format=rss"
