name: Amigos Broad Web Provider Probe

on:
  push:
    paths:
      - ".github/workflows/amigos-broad-web-provider-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe open broad-web doors
        run: |
          set +e
          Q='Perth Australia salmon fishing May best bait'

          echo '=== MWMBL ==='
          CODE=$(curl -L --max-time 20 -sS -o /tmp/mwmbl --get             --data-urlencode "s=$Q"             -w '%{http_code}'             'https://api.mwmbl.org/api/v1/search/')
          echo "MWMBL_STATUS=$CODE BYTES=$(wc -c </tmp/mwmbl)"
          head -c 3000 /tmp/mwmbl; echo

          echo '=== MARGINALIA ==='
          CODE2=$(curl -L --max-time 20 -sS -o /tmp/marg             -H 'API-Key: public'             --get             --data-urlencode "query=$Q"             --data-urlencode 'count=10'             -w '%{http_code}'             'https://api2.marginalia-search.com/search')
          echo "MARGINALIA_STATUS=$CODE2 BYTES=$(wc -c </tmp/marg)"
          head -c 3000 /tmp/marg; echo
