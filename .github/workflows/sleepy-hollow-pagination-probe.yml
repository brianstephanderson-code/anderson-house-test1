name: Sleepy Hollow Pagination Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sleepy-hollow-pagination-probe.yml'
      - 'books/sleepy-hollow/pagination_probe.py'

permissions:
  contents: write

jobs:
  paginate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install probe renderer
        run: python -m pip install --quiet reportlab pypdf

      - name: Acquire canonical Gutenberg source
        run: |
          mkdir -p .build/sleepy-hollow/pagination
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            https://www.gutenberg.org/cache/epub/41/pg41.txt \
            --output .build/sleepy-hollow/master.txt

      - name: Render three candidate trims and measure pages
        run: |
          python books/sleepy-hollow/pagination_probe.py \
            --input .build/sleepy-hollow/master.txt \
            --out-dir .build/sleepy-hollow/pagination \
            --result .build/sleepy-hollow/pagination/PAGINATION-PROBE-001.json

      - name: Preserve pagination PDFs and measurement
        uses: actions/upload-artifact@v4
        with:
          name: sleepy-hollow-pagination-probe
          path: .build/sleepy-hollow/pagination/
          retention-days: 90

      - name: Publish durable measured pagination state
        run: |
          cp .build/sleepy-hollow/pagination/PAGINATION-PROBE-001.json books/sleepy-hollow/PAGINATION-PROBE-001.json
          git config user.name "Sleepy Hollow Pagination Probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/sleepy-hollow/PAGINATION-PROBE-001.json
          if git diff --cached --quiet; then
            echo "Pagination result unchanged"
            exit 0
          fi
          git commit -m "Record Sleepy Hollow measured pagination"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
