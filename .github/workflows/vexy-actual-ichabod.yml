name: Vexy Actual Ichabod

on:
  push:
    paths:
      - '.github/workflows/vexy-actual-ichabod.yml'
      - 'tomo_bridge/vexy/playlines_actual.py'
      - 'books/sleepy-hollow/art/working/ichabod-vexy-source-600.jpg.b64'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vexy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Send approved Ichabod working copy through Vexy
        run: python tomo_bridge/vexy/playlines_actual.py
      - name: Upload Vexy result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ichabod-vexy-linear
          path: vexy_actual_out/
          if-no-files-found: error
