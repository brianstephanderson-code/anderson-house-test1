name: Vexy Ichabod Actual

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vexy-ichabod-actual.yml'

permissions:
  contents: read

jobs:
  vexy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run approved Ichabod through Vexy
        run: python tomo_bridge/vexy/ichabod_actual.py
      - name: Upload Vexy output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexy-ichabod-actual
          path: vexy_ichabod_out/
          if-no-files-found: error
