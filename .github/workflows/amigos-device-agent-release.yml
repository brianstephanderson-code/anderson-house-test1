name: Release Three Amigos Device Agent

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "android/amigos-device-agent/**"
      - ".github/workflows/amigos-device-agent-release.yml"

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/amigos-device-agent
    env:
      AMIGOS_KEYSTORE_PASSWORD: ${{ secrets.AMIGOS_KEYSTORE_PASSWORD }}
      AMIGOS_KEY_ALIAS: ${{ secrets.AMIGOS_KEY_ALIAS }}
      AMIGOS_KEY_PASSWORD: ${{ secrets.AMIGOS_KEY_PASSWORD }}
      AMIGOS_VERSION_CODE: ${{ github.run_number }}
      AMIGOS_VERSION_NAME: 1.1.${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Require private signing secrets
        shell: bash
        run: |
          test -n "${{ secrets.AMIGOS_KEYSTORE_B64 }}" || { echo "Missing AMIGOS_KEYSTORE_B64"; exit 2; }
          test -n "$AMIGOS_KEYSTORE_PASSWORD" || { echo "Missing AMIGOS_KEYSTORE_PASSWORD"; exit 2; }
          test -n "$AMIGOS_KEY_ALIAS" || { echo "Missing AMIGOS_KEY_ALIAS"; exit 2; }
          test -n "$AMIGOS_KEY_PASSWORD" || { echo "Missing AMIGOS_KEY_PASSWORD"; exit 2; }

      - name: Restore signing keystore
        shell: bash
        run: |
          printf '%s' "${{ secrets.AMIGOS_KEYSTORE_B64 }}" | base64 --decode > "$RUNNER_TEMP/amigos-release.jks"
          chmod 600 "$RUNNER_TEMP/amigos-release.jks"
          echo "AMIGOS_KEYSTORE_PATH=$RUNNER_TEMP/amigos-release.jks" >> "$GITHUB_ENV"

      - name: Fetch pinned Hey Tomo runtime
        shell: bash
        run: bash tools/fetch_wake_deps.sh

      - name: Build signed release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify APK exists
        shell: bash
        run: |
          test -s app/build/outputs/apk/release/app-release.apk
          sha256sum app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: three-amigos-device-agent-signed
          path: android/amigos-device-agent/app/build/outputs/apk/release/app-release.apk
