name: Sleepy Hollow Reader Aid Stress Probe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sleepy-hollow-reader-aid-stress.yml'
      - 'books/sleepy-hollow/reader_aid_stress_probe.py'
      - 'books/sleepy-hollow/RESEARCH-BACKLOG-001.json'
      - 'books/sleepy-hollow/ASSEMBLY-MAP-001.json'
      - 'books/sleepy-hollow/PAGINATION-PROBE-001.json'

permissions:
  contents: write

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install render dependencies
        run: python -m pip install --quiet reportlab pypdf
      - name: Acquire canonical Gutenberg source
        run: |
          mkdir -p .build/sleepy-hollow/stress
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 \
            https://www.gutenberg.org/cache/epub/41/pg41.txt \
            --output .build/sleepy-hollow/master.txt
      - name: Render synthetic reader-aid stress load at all three trims
        run: |
          python books/sleepy-hollow/reader_aid_stress_probe.py \
            --input .build/sleepy-hollow/master.txt \
            --backlog books/sleepy-hollow/RESEARCH-BACKLOG-001.json \
            --assembly-map books/sleepy-hollow/ASSEMBLY-MAP-001.json \
            --baseline books/sleepy-hollow/PAGINATION-PROBE-001.json \
            --out-dir .build/sleepy-hollow/stress \
            --result .build/sleepy-hollow/stress/READER-AID-STRESS-001.json
      - name: Preserve stress PDFs and measurements
        uses: actions/upload-artifact@v4
        with:
          name: sleepy-hollow-reader-aid-stress
          path: .build/sleepy-hollow/stress/
          retention-days: 90
      - name: Publish durable stress result
        run: |
          cp .build/sleepy-hollow/stress/READER-AID-STRESS-001.json books/sleepy-hollow/READER-AID-STRESS-001.json
          git config user.name "Sleepy Hollow Reader Aid Stress Probe"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/sleepy-hollow/READER-AID-STRESS-001.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record Sleepy Hollow reader aid stress result"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((attempt * 2))
          done
          exit 1
