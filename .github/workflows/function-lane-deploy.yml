name: The 3 Amigos Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Cloud target
        required: true
        default: all
        type: choice
        options: [all, cloudflare, aws, google]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test parent function
        run: node --test function-lane/test/*.test.mjs

  cloudflare:
    concurrency:
      group: function-lane-cloudflare-ah-word-count
      cancel-in-progress: false
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'cloudflare' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage shared core
        run: |
          mkdir -p function-lane/cloudflare/core
          cp function-lane/core/*.mjs function-lane/cloudflare/core/
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: function-lane/cloudflare

  cloudflare-check:
    if: ${{ always() && needs.cloudflare.result == 'success' }}
    needs: [cloudflare]
    runs-on: ubuntu-latest
    steps:
      - name: Existing live profile check
        run: |
          BODY="$(curl --fail --silent --show-error --get --data-urlencode 'text=Many hands work. Bees return!' 'https://ah-word-count.brian-steph-anderson.workers.dev')"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.words!==5||b.sentences!==2) process.exit(1)' "$BODY"
      - name: Live SEARCH_DISCOVER capability probe
        run: |
          BODY="$(curl --fail --silent --show-error --get \
            --data-urlencode 'type=SEARCH_DISCOVER' \
            --data-urlencode 'query=Washington Irving Sleepy Hollow author purpose' \
            --data-urlencode 'limit=5' \
            'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "$BODY"
          node -e 'const b=JSON.parse(process.argv[1]); if(!b.ok||b.function!=="SEARCH_DISCOVER"||b.cost_gate!=="$0"||!Array.isArray(b.results)||b.results.length<1||!b.results.every(x=>x.url&&x.source_door&&x.provenance)) process.exit(1)' "$BODY"

      - name: Live Library of Congress door probe
        run: |
          BODY="$(curl --fail --silent --show-error --get --data-urlencode 'type=SEARCH_DISCOVER_LOC' --data-urlencode 'query=Washington Irving Sleepy Hollow' --data-urlencode 'limit=5' 'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "LOC_DOOR_2=$BODY"
          node -e 'const b=JSON.parse(process.argv[1]); if(!b.ok||b.function!=="SEARCH_DISCOVER_LOC"||b.cost_gate!=="$0"||!Array.isArray(b.results)||b.results.length<1||!b.results.every(x=>x.url&&x.source_door==="LIBRARY_OF_CONGRESS_JSON_API"&&x.provenance)) process.exit(1)' "$BODY"
      - name: Priority 20-way return-as-ready benchmark
        run: |
          cat > /tmp/benchmark.json <<'JSON'
          {"type":"SEARCH_DISCOVER_STREAM","parent_ticket":"IRVING-020","limit":3,"queries":["Washington Irving purpose writing The Legend of Sleepy Hollow","Washington Irving intent The Legend of Sleepy Hollow","why did Washington Irving write The Legend of Sleepy Hollow","what did Washington Irving want to communicate Sleepy Hollow","Washington Irving Sleepy Hollow satire social commentary","Washington Irving Sleepy Hollow folklore purpose","Washington Irving Sleepy Hollow historical cultural context purpose","Washington Irving own words Sleepy Hollow purpose letters","Washington Irving Sleepy Hollow contemporary reception purpose","Washington Irving Sleepy Hollow themes author intent","Washington Irving influences sources Legend of Sleepy Hollow","Sleepy Hollow Dutch folklore Irving source","Sleepy Hollow German folklore Headless Horseman Irving","Washington Irving American identity Sleepy Hollow","Washington Irving humor irony Sleepy Hollow","Ichabod Crane satire Washington Irving purpose","Brom Bones satire Washington Irving Sleepy Hollow","Sleepy Hollow superstition reason Irving theme","Sleepy Hollow early reviews 1820 Washington Irving","Washington Irving Sketch Book Sleepy Hollow purpose context"]}
          JSON
          curl --fail --silent --show-error --no-buffer -X POST -H 'content-type: application/json' --data-binary @/tmp/benchmark.json 'https://ah-word-count.brian-steph-anderson.workers.dev' | tee /tmp/returns.ndjson
          node -e 'const fs=require("fs"); const rows=fs.readFileSync("/tmp/returns.ndjson","utf8").trim().split(/\n/).map(JSON.parse); const kids=rows.filter(x=>x.type==="CHILD_RETURN"); const done=rows.find(x=>x.type==="PARENT_COMPLETE"); if(kids.length!==20||kids.some(x=>!x.ok)||!done||done.expected!==20||done.received!==20) process.exit(1); console.log("RETURN_ORDER",kids.map(x=>x.child_ticket+":"+x.elapsed_ms+"ms").join(" ")); console.log("PARENT_COMPLETE",done.elapsed_ms+"ms")'

  aws:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'aws') }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo 'AWS unchanged; SEARCH_DISCOVER first-fish is being proven on Cloudflare before replication.'

  google:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'google') }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Google unchanged; SEARCH_DISCOVER first-fish is being proven on Cloudflare before replication.'
