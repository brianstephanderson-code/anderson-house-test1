name: Function Lane Deploy

on:
  push:
    branches:
      - main
    paths:
      - "function-lane/**"
      - ".github/workflows/function-lane-deploy.yml"
  workflow_dispatch:
    inputs:
      target:
        description: Cloud target
        required: true
        default: all
        type: choice
        options:
          - all
          - cloudflare
          - aws
          - google

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test parent function
        run: node --test function-lane/test/*.test.mjs

  cloudflare:
    concurrency:
      group: function-lane-cloudflare-ah-word-count
      cancel-in-progress: false
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'cloudflare' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage shared core
        run: |
          mkdir -p function-lane/cloudflare/core
          cp function-lane/core/word_count.mjs function-lane/cloudflare/core/word_count.mjs
          cp function-lane/core/sentence_count.mjs function-lane/cloudflare/core/sentence_count.mjs
          cp function-lane/core/paragraph_count.mjs function-lane/cloudflare/core/paragraph_count.mjs
          cp function-lane/core/terminal_punctuation.mjs function-lane/cloudflare/core/terminal_punctuation.mjs
          cp function-lane/core/particle_route.mjs function-lane/cloudflare/core/particle_route.mjs
          cp function-lane/core/terminal_punctuation_verifier.mjs function-lane/cloudflare/core/terminal_punctuation_verifier.mjs
          cp function-lane/core/provider_hive.mjs function-lane/cloudflare/core/provider_hive.mjs
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: function-lane/cloudflare

  aws:
    concurrency:
      group: function-lane-aws-ahhello
      cancel-in-progress: false
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'aws' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage Lambda package
        run: |
          rm -rf .build/aws
          mkdir -p .build/aws/core
          cp function-lane/aws/index.mjs .build/aws/index.mjs
          cp function-lane/core/word_count.mjs .build/aws/core/word_count.mjs
          cp function-lane/core/sentence_count.mjs .build/aws/core/sentence_count.mjs
          cp function-lane/core/paragraph_count.mjs .build/aws/core/paragraph_count.mjs
          cp function-lane/core/terminal_punctuation.mjs .build/aws/core/terminal_punctuation.mjs
          cp function-lane/core/particle_route.mjs .build/aws/core/particle_route.mjs
          cp function-lane/core/terminal_punctuation_verifier.mjs .build/aws/core/terminal_punctuation_verifier.mjs
          cp function-lane/core/provider_hive.mjs .build/aws/core/provider_hive.mjs
      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Deploy Lambda
        uses: aws-actions/aws-lambda-deploy@v1.1.1
        with:
          function-name: ${{ vars.AWS_LAMBDA_FUNCTION || 'ahHello' }}
          code-artifacts-dir: .build/aws
          handler: index.handler
          runtime: nodejs22.x
          role: ${{ vars.AWS_LAMBDA_EXECUTION_ROLE }}

  google:
    concurrency:
      group: function-lane-google-ahhello
      cancel-in-progress: false
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'google' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage Google function
        run: |
          rm -rf .build/google
          mkdir -p .build/google/core
          cp function-lane/google/index.mjs .build/google/index.mjs
          cp function-lane/google/package.json .build/google/package.json
          cp function-lane/core/word_count.mjs .build/google/core/word_count.mjs
          cp function-lane/core/sentence_count.mjs .build/google/core/sentence_count.mjs
          cp function-lane/core/paragraph_count.mjs .build/google/core/paragraph_count.mjs
          cp function-lane/core/terminal_punctuation.mjs .build/google/core/terminal_punctuation.mjs
          cp function-lane/core/particle_route.mjs .build/google/core/particle_route.mjs
          cp function-lane/core/terminal_punctuation_verifier.mjs .build/google/core/terminal_punctuation_verifier.mjs
          cp function-lane/core/provider_hive.mjs .build/google/core/provider_hive.mjs
      - name: Authenticate to Google Cloud with WIF
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Deploy Google function
        id: deploy-google
        uses: google-github-actions/deploy-cloud-functions@v4
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          region: ${{ vars.GCP_REGION || 'us-east1' }}
          name: ${{ vars.GCP_FUNCTION_NAME || 'ahhello' }}
          runtime: nodejs22
          entry_point: wordCount
          source_dir: .build/google



  cloudflare-check:
    if: ${{ always() && needs.cloudflare.result == 'success' }}
    needs:
      - cloudflare
    runs-on: ubuntu-latest
    steps:
      - name: Live Cloudflare check
        run: |
          METRICS="$(curl --fail --silent --show-error --get \
            --output /tmp/cf-body.json \
            --write-out '%{time_total}\t%{size_download}\t%{http_code}' \
            --data-urlencode 'text=Many hands work. Bees return!' \
            'https://ah-word-count.brian-steph-anderson.workers.dev')"

          IFS=$'\t' read -r SECONDS BYTES HTTP <<< "$METRICS"
          BODY="$(cat /tmp/cf-body.json)"
          echo "$BODY"

          node -e '
            const body = JSON.parse(process.argv[1]);
            if (body.words !== 5 || body.sentences !== 2 || body.paragraphs !== 1 || body.terminalPunctuation !== true) {
              console.error("Unexpected Cloudflare live result", body);
              process.exit(1);
            }
          ' "$BODY"

          {
            echo "## Cloudflare Door"
            echo
            echo "| Gauge | Value |"
            echo "|---|---:|"
            echo "| State | success |"
            echo "| HTTP | $HTTP |"
            echo "| Response seconds | $SECONDS |"
            echo "| Response bytes | $BYTES |"
          } >> "$GITHUB_STEP_SUMMARY"

  aws-check:
    concurrency:
      group: function-lane-aws-ahhello
      cancel-in-progress: false
    if: ${{ always() && needs.aws.result == 'success' }}
    needs:
      - aws
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Live AWS check
        env:
          FUNCTION_NAME: ${{ vars.AWS_LAMBDA_FUNCTION || 'ahHello' }}
        run: |
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{"text":"Many hands work. Bees return!"}' \
            /tmp/aws-response.json >/tmp/aws-meta.json

          node -e '
            const fs = require("fs");
            const outer = JSON.parse(fs.readFileSync("/tmp/aws-response.json", "utf8"));
            const body = typeof outer.body === "string" ? JSON.parse(outer.body) : outer;
            if (body.words !== 5 || body.sentences !== 2 || body.paragraphs !== 1 || body.terminalPunctuation !== true) {
              console.error("Unexpected AWS live result", body);
              process.exit(1);
            }
          '

          START="$(date -u -d '1 hour ago' +%Y-%m-%dT%H:%M:%SZ)"
          END="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          set +e
          INV_JSON="$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Lambda \
            --metric-name Invocations \
            --dimensions "Name=FunctionName,Value=$FUNCTION_NAME" \
            --start-time "$START" --end-time "$END" --period 3600 \
            --statistics Sum --output json 2>/tmp/aws-metric-error)"
          RC=$?
          set -e

          {
            echo "## AWS Door"
            echo
            echo "Live Lambda answer: **success**"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$RC" -eq 0 ]; then
            INV="$(echo "$INV_JSON" | jq '[.Datapoints[].Sum] | add // 0')"
            echo "Last-hour Lambda invocations: **$INV**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "CloudWatch metrics: **telemetry permission still missing**" >> "$GITHUB_STEP_SUMMARY"
          fi

  google-check:
    concurrency:
      group: function-lane-google-ahhello
      cancel-in-progress: false
    if: ${{ always() && needs.google.result == 'success' }}
    needs:
      - google
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Google live and capacity check
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          REGION: ${{ vars.GCP_REGION || 'us-east1' }}
          FUNCTION_NAME: ${{ vars.GCP_FUNCTION_NAME || 'ahhello' }}
        run: |
          FUNCTION_JSON="$(gcloud functions describe "$FUNCTION_NAME" --gen2 --region "$REGION" --project "$PROJECT_ID" --format=json)"
          URI="$(echo "$FUNCTION_JSON" | jq -r '.serviceConfig.uri // empty')"
          MEMORY="$(echo "$FUNCTION_JSON" | jq -r '.serviceConfig.availableMemory // "unknown"')"
          MAX="$(echo "$FUNCTION_JSON" | jq -r '.serviceConfig.maxInstanceCount // "provider default"')"

          {
            echo "## Google Door"
            echo
            echo "| Gauge | Value |"
            echo "|---|---:|"
            echo "| State | success |"
            echo "| Configured memory | $MEMORY |"
            echo "| Maximum instances | $MAX |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$URI" ]; then
            TOKEN="$(gcloud auth print-identity-token --audiences="$URI")"
            METRICS="$(curl --fail --silent --show-error --get \
              --output /tmp/google-body.json \
              --write-out '%{time_total}\t%{size_download}\t%{http_code}' \
              -H "Authorization: Bearer $TOKEN" \
              --data-urlencode 'text=Many hands work. Bees return!' \
              "$URI")"
            IFS=$'\t' read -r SECONDS BYTES HTTP <<< "$METRICS"
            {
              echo "| Live HTTP | $HTTP |"
              echo "| Response seconds | $SECONDS |"
              echo "| Response bytes | $BYTES |"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  health:
    if: ${{ always() }}
    needs:
      - test
      - cloudflare-check
      - aws-check
      - google-check
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate independent door states
        env:
          TEST_STATE: ${{ needs.test.result }}
          AWS_STATE: ${{ needs.aws-check.result }}
          GOOGLE_STATE: ${{ needs.google-check.result }}
          CLOUDFLARE_STATE: ${{ needs.cloudflare-check.result }}
        run: |
          {
            echo "## Function Lane Aggregate"
            echo
            echo "| Door | State |"
            echo "|---|---|"
            echo "| Test | $TEST_STATE |"
            echo "| AWS | $AWS_STATE |"
            echo "| Google | $GOOGLE_STATE |"
            echo "| Cloudflare | $CLOUDFLARE_STATE |"
          } >> "$GITHUB_STEP_SUMMARY"

          test "$TEST_STATE" = "success"
          test "$AWS_STATE" = "success"
          test "$GOOGLE_STATE" = "success"
          test "$CLOUDFLARE_STATE" = "success"

  usage:
    if: ${{ always() && needs.health.result == 'success' }}
    needs:
      - health
    runs-on: ubuntu-latest
    steps:
      - name: Measure run usage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          JOBS_JSON="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100")"

          echo "$JOBS_JSON" > /tmp/jobs.json
          TOTAL_SECONDS="$(jq '[.jobs[] | select(.started_at != null and .completed_at != null) | ((.completed_at|fromdateiso8601)-(.started_at|fromdateiso8601))] | add // 0' /tmp/jobs.json)"

          {
            echo "## Function Land Usage"
            echo
            echo "Completed runner seconds so far: **$TOTAL_SECONDS**"
            echo
            echo "_Each cloud door now reports independently; this final usage job waits only to make the whole-run total._"
          } >> "$GITHUB_STEP_SUMMARY"
