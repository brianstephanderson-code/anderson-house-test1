name: The 3 Amigos Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Cloud target
        required: true
        default: all
        type: choice
        options: [all, cloudflare, aws, google]

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test parent function
        run: node --test function-lane/test/*.test.mjs

  cloudflare:
    concurrency:
      group: function-lane-cloudflare-ah-word-count
      cancel-in-progress: false
    if: ${{ github.event_name == 'push' || inputs.target == 'all' || inputs.target == 'cloudflare' }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Stage shared core
        run: |
          mkdir -p function-lane/cloudflare/core
          cp function-lane/core/*.mjs function-lane/cloudflare/core/
      - name: Install Cloudflare browser dependency
        working-directory: function-lane/cloudflare
        run: npm install --no-audit --no-fund
      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: function-lane/cloudflare

  cloudflare-check:
    if: ${{ always() && needs.cloudflare.result == 'success' }}
    needs: [cloudflare]
    runs-on: ubuntu-latest
    steps:
      - name: Existing live profile check
        run: |
          BODY="$(curl --fail --silent --show-error --get --data-urlencode 'text=Many hands work. Bees return!' 'https://ah-word-count.brian-steph-anderson.workers.dev')"
          node -e 'const b=JSON.parse(process.argv[1]); if(b.words!==5||b.sentences!==2) process.exit(1)' "$BODY"
      - name: Live SEARCH_DISCOVER capability probe
        run: |
          BODY="$(curl --fail --silent --show-error --get \
            --data-urlencode 'type=SEARCH_DISCOVER' \
            --data-urlencode 'query=Washington Irving Sleepy Hollow author purpose' \
            --data-urlencode 'limit=5' \
            'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "$BODY"
          node -e 'const b=JSON.parse(process.argv[1]); if(!b.ok||b.function!=="SEARCH_DISCOVER"||b.cost_gate!=="$0"||!Array.isArray(b.results)||b.results.length<1||!b.results.every(x=>x.url&&x.source_door&&x.provenance)) process.exit(1)' "$BODY"

      - name: Live Library of Congress door probe
        run: |
          BODY="$(curl --fail --silent --show-error --get --data-urlencode 'type=SEARCH_DISCOVER_LOC' --data-urlencode 'query=Washington Irving Sleepy Hollow' --data-urlencode 'limit=5' 'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "LOC_DOOR_2=$BODY"
          node -e 'const b=JSON.parse(process.argv[1]); const allowed=new Set(["LIBRARY_OF_CONGRESS_JSON_API","LIBRARY_OF_CONGRESS_SRU_CATALOG"]); const officialUrl=x=>{try{const h=new URL(x.url).hostname.toLowerCase();return h==="loc.gov"||h.endsWith(".loc.gov");}catch{return false}}; const live=b.ok&&b.function==="SEARCH_DISCOVER_LOC"&&Array.isArray(b.results)&&b.results.length>0&&b.results.every(x=>x.url&&allowed.has(x.source_door)&&x.provenance&&officialUrl(x)); const blocked=!b.ok&&b.function==="SEARCH_DISCOVER_LOC"&&b.blocked===true&&["HTTP_403","HTTP_429","ALL_OFFICIAL_LOC_ROUTES_FAILED"].includes(b.error)&&b.provenance; if(!live&&!blocked) process.exit(1); console.log(live?"LOC_ROUTE_OK route="+(b.route||"DIRECT")+" count="+b.results.length+" source="+b.results[0].source_door:"LOC_ROUTE_BLOCKED_SOFT "+b.error+" direct="+(b.direct_error||""));' "$BODY"
      - name: Live lightweight text-reader probe
        run: |
          BODY="$(curl --fail --silent --show-error --get --data-urlencode 'type=FETCH_TEXT' --data-urlencode 'url=https://example.com/' --data-urlencode 'max_chars=12000' 'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "$BODY" > /tmp/fetch-text.json
          node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync("/tmp/fetch-text.json","utf8")); if(!b.ok||b.function!=="FETCH_TEXT"||!b.provenance||typeof b.text!=="string"||b.text.length<100||b.text.length>12000||/<script|<style|<img/i.test(b.text)) process.exit(1); console.log("FETCH_TEXT_OK chars="+b.chars+" url="+b.url); console.log("TEXT_SAMPLE "+b.text.slice(0,500));'
      - name: Live Borged readable-text-plus-links probe
        if: ${{ always() }}
        run: |
          BODY="$(curl --fail --silent --show-error --get \
            --data-urlencode 'type=READ_TEXT_LINKS' \
            --data-urlencode 'url=https://example.com/' \
            --data-urlencode 'max_chars=6000' \
            --data-urlencode 'max_links=25' \
            'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "$BODY" > /tmp/read-text-links.json
          echo "READ_TEXT_LINKS_BODY=$BODY"
          node -e 'const fs=require("fs"); const b=JSON.parse(fs.readFileSync("/tmp/read-text-links.json","utf8")); if(!b.ok||b.function!=="READ_TEXT_LINKS"||!b.provenance||typeof b.text!=="string"||b.text.length<100||b.text.length>6000||!Array.isArray(b.links)||b.links.length>25||b.link_count!==b.links.length||b.links.some(x=>!/^https?:\/\//.test(x.url))||/<script|<style|<img|<form/i.test(b.text)) process.exit(1); console.log("READ_TEXT_LINKS_OK chars="+b.chars+" links="+b.link_count+" url="+b.url); console.log("TEXT_SAMPLE "+b.text.slice(0,300)); console.log("LINK_SAMPLE "+(b.links.length?b.links.slice(0,5).map(x=>x.url).join(" | "):"NONE (valid zero-link page)"));'

      - name: Live SEARCH_WEB_PUBLIC proof
        if: ${{ always() }}
        run: |
          BODY="$(curl --fail --silent --show-error --get \
            --data-urlencode 'type=SEARCH_WEB_PUBLIC' \
            --data-urlencode 'query=Perth Australia salmon fishing May best bait' \
            --data-urlencode 'limit=8' \
            'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "SEARCH_WEB_PUBLIC_BODY=$BODY"
          node -e 'const b=JSON.parse(process.argv[1]); if(!b.ok||b.function!=="SEARCH_WEB_PUBLIC"||!Array.isArray(b.results)||b.results.length<1||!b.results.every(x=>x.url&&x.title&&x.source_door&&x.provenance)) process.exit(1); console.log("SEARCH_WEB_PUBLIC_OK route="+b.route+" count="+b.results.length+" first="+b.results[0].url);' "$BODY"

      - name: Live SEARCH_END_TO_END_V1 proof
        if: ${{ always() }}
        run: |
          BODY="$(curl --fail --silent --show-error --get \
            --data-urlencode 'type=SEARCH_END_TO_END_V1' \
            --data-urlencode 'query=Washington Irving Sleepy Hollow author purpose' \
            --data-urlencode 'limit=5' \
            --data-urlencode 'read_limit=3' \
            --data-urlencode 'max_chars=4000' \
            'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "$BODY" > /tmp/search-e2e.json
          node -e 'const fs=require("fs");const b=JSON.parse(fs.readFileSync("/tmp/search-e2e.json","utf8")); const s=b.stages||{}; if(!b.ok||b.function!=="SEARCH_END_TO_END_V1"||!s.cast||!s.collect||!s.shortlist||!s.read||!s.verify||!s.sufficient||!Array.isArray(b.evidence)||b.evidence.length<1||!b.evidence.every(x=>x.integrity_verified&&x.url&&x.source_door&&x.discovery_provenance&&x.reader_provenance&&typeof x.text==="string"&&x.text.length>=100)||!b.sufficiency?.sufficient) process.exit(1); console.log("SEARCH_END_TO_END_V1_OK candidates="+b.candidate_count+" evidence="+b.evidence.length+" doors="+b.doors.map(x=>x.door+":"+(x.ok?"OK":x.blocked?"BLOCKED":"FAIL")).join(",")); console.log("EVIDENCE "+b.evidence[0].source_door+" "+b.evidence[0].url+" chars="+b.evidence[0].chars);'

      - name: Priority 20-way return-as-ready benchmark
        run: |
          cat > /tmp/benchmark.json <<'JSON'
          {"type":"SEARCH_DISCOVER_STREAM","parent_ticket":"IRVING-020","limit":3,"queries":["Washington Irving purpose writing The Legend of Sleepy Hollow","Washington Irving intent The Legend of Sleepy Hollow","why did Washington Irving write The Legend of Sleepy Hollow","what did Washington Irving want to communicate Sleepy Hollow","Washington Irving Sleepy Hollow satire social commentary","Washington Irving Sleepy Hollow folklore purpose","Washington Irving Sleepy Hollow historical cultural context purpose","Washington Irving own words Sleepy Hollow purpose letters","Washington Irving Sleepy Hollow contemporary reception purpose","Washington Irving Sleepy Hollow themes author intent","Washington Irving influences sources Legend of Sleepy Hollow","Sleepy Hollow Dutch folklore Irving source","Sleepy Hollow German folklore Headless Horseman Irving","Washington Irving American identity Sleepy Hollow","Washington Irving humor irony Sleepy Hollow","Ichabod Crane satire Washington Irving purpose","Brom Bones satire Washington Irving Sleepy Hollow","Sleepy Hollow superstition reason Irving theme","Sleepy Hollow early reviews 1820 Washington Irving","Washington Irving Sketch Book Sleepy Hollow purpose context"]}
          JSON
          curl --fail --silent --show-error --no-buffer -X POST -H 'content-type: application/json' --data-binary @/tmp/benchmark.json 'https://ah-word-count.brian-steph-anderson.workers.dev' | tee /tmp/returns.ndjson
          node -e 'const fs=require("fs"); const rows=fs.readFileSync("/tmp/returns.ndjson","utf8").trim().split(/\n/).map(JSON.parse); const kids=rows.filter(x=>x.type==="CHILD_RETURN"); const done=rows.find(x=>x.type==="PARENT_COMPLETE"); if(kids.length!==20||kids.some(x=>!x.ok)||!done||done.expected!==20||done.received!==20) process.exit(1); console.log("RETURN_ORDER",kids.map(x=>x.child_ticket+":"+x.elapsed_ms+"ms").join(" ")); console.log("PARENT_COMPLETE",done.elapsed_ms+"ms")'

  aws:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'aws') }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo 'AWS unchanged; SEARCH_DISCOVER first-fish is being proven on Cloudflare before replication.'

  google:
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'google') }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Google unchanged; SEARCH_DISCOVER first-fish is being proven on Cloudflare before replication.'
