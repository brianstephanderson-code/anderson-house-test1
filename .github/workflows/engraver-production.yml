name: Three Amigos Boxlab Engraver

on:
  push:
    paths:
      - 'books/sleepy-hollow/art/master/ichabod_crane_faces_the_headless_horseman.jpg'
      - 'books/sleepy-hollow/art/engraver/JOB-ICHABOD-002.json'
      - 'tomo_bridge/engraver/run_asset.py'
      - '.github/workflows/engraver-production.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  engraver:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_PATH: books/sleepy-hollow/art/master/ichabod_crane_faces_the_headless_horseman.jpg
      JOB_ID: ichabod-002
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser bridge
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run Boxlab Engraver probe
        run: |
          python tomo_bridge/engraver/run_asset.py "$SOURCE_PATH" "books/sleepy-hollow/art/engraver/out/$JOB_ID"
      - name: Warehouse result
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/sleepy-hollow/art/engraver/out
          if ! git diff --cached --quiet; then
            git commit -m "Warehouse Boxlab Engraver output $JOB_ID [skip ci]"
            git push
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engraver-${{ env.JOB_ID }}
          path: books/sleepy-hollow/art/engraver/out/${{ env.JOB_ID }}/
          if-no-files-found: warn
