name: Build Three Amigos Device Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "android/amigos-device-agent/**"
      - ".github/workflows/build-amigos-device-agent.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/amigos-device-agent
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: three-amigos-device-agent-debug
          path: android/amigos-device-agent/app/build/outputs/apk/debug/app-debug.apk
