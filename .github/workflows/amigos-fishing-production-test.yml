name: Amigos Fishing Production Test

on:
  push:
    paths:
      - ".github/workflows/amigos-fishing-production-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fishing-test:
    runs-on: ubuntu-latest
    steps:
      - name: Ask exact fishing question through SEARCH_END_TO_END_V1 multi-door proof after fail-soft multi-door Borg
        run: |
          QUESTION="I want to go fishing in May. I want to go fishing for salmon. I'm in Perth, Australia. I don't want to go 200 kilometers out of Perth to catch the salmon. I'd like to catch them within that distance. What bait is the best?"
          BODY="$(curl --fail --silent --show-error --get             --data-urlencode 'type=SEARCH_END_TO_END_V1'             --data-urlencode "query=$QUESTION"             --data-urlencode 'limit=8'             --data-urlencode 'read_limit=5'             --data-urlencode 'max_chars=5000'             'https://ah-word-count.brian-steph-anderson.workers.dev')"
          echo "AMIGOS_FISHING_RESULT=$BODY"
          printf '%s' "$BODY" > fishing-result.json
          node - <<'NODE'
          const fs=require("fs");
          const b=JSON.parse(fs.readFileSync("fishing-result.json","utf8"));
          console.log("FUNCTION", b.function);
          console.log("OK", b.ok);
          console.log("QUERY", b.query);
          console.log("DOORS", JSON.stringify(b.doors));
          console.log("CANDIDATE_COUNT", b.candidate_count);
          console.log("SHORTLIST_COUNT", b.shortlist_count);
          console.log("SUFFICIENCY", JSON.stringify(b.sufficiency));
          for (const [i,e] of (b.evidence||[]).entries()) {
            console.log("EVIDENCE_"+(i+1), JSON.stringify({
              title:e.title,
              url:e.url,
              source_door:e.source_door,
              chars:e.chars,
              discovery_provenance:e.discovery_provenance,
              reader_provenance:e.reader_provenance,
              text:(e.text||"").slice(0,1000)
            }));
          }
          NODE

# live-pool-proof-2
