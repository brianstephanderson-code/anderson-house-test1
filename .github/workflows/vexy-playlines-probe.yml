name: Vexy Playlines Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vexy-playlines-probe.yml'
      - 'tomo_bridge/vexy/playlines_probe.py'
      - 'tomo_bridge/vexy/input/**'

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Reconstruct approved Ichabod input
        run: |
          cat tomo_bridge/vexy/input/ichabod_vexy_input.b64.part* | base64 -d > /tmp/ichabod_vexy_input.jpg
          python - <<'PY'
          from PIL import Image
          p = "/tmp/ichabod_vexy_input.jpg"
          im = Image.open(p)
          print("ICHABOD_INPUT", im.size, im.mode)
          im.verify()
          print("ICHABOD_INPUT_OK")
          PY

      - name: Drive Vexy Playlines
        env:
          VEXY_INPUT: /tmp/ichabod_vexy_input.jpg
        run: python tomo_bridge/vexy/playlines_probe.py

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexy-playlines-probe
          path: vexy_probe_out/
          if-no-files-found: warn


      - name: Publish latest Vexy output to repository
        if: always()
        run: |
          rm -rf tomo_bridge/vexy/latest-output
          mkdir -p tomo_bridge/vexy/latest-output
          cp -a vexy_probe_out/. tomo_bridge/vexy/latest-output/ || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tomo_bridge/vexy/latest-output
          if ! git diff --cached --quiet; then
            git commit -m "Store latest Vexy output [skip ci]"
            git push
          fi
