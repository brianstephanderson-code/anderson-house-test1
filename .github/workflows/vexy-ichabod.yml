name: Vexy Ichabod Real Art

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/vexy-ichabod.yml'

permissions:
  contents: read

jobs:
  engrave:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser
        run: |
          pip install pillow playwright
          python -m playwright install --with-deps chromium
      - name: Rebuild approved working copy
        run: python tomo_bridge/vexy/make_ichabod_probe.py
      - name: Point probe at Ichabod
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("tomo_bridge/vexy/playlines_probe.py")
          s=p.read_text()
          start=s.index('SRC = OUT / "probe_input.png"')
          end=s.index('report = {"url":')
          replacement='SRC = Path("tomo_bridge/vexy/ichabod_probe.jpg")\n\n'
          p.write_text(s[:start]+replacement+s[end:])
          PY
      - name: Run Vexy
        run: python tomo_bridge/vexy/playlines_probe.py
      - name: Save real-art result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexy-ichabod-real-art
          path: vexy_probe_out/
          if-no-files-found: error
