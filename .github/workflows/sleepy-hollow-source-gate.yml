name: Sleepy Hollow Source Gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sleepy-hollow-source-gate.yml'
      - 'function-lane/core/**'
      - 'function-lane/test/**'

permissions:
  contents: read

jobs:
  source-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Linda tests reusable conveyor functions
        run: node --test function-lane/test/*.test.mjs
      - name: Acquire canonical Gutenberg source with retry
        run: |
          mkdir -p .build/sleepy-hollow
          curl --fail --silent --show-error --location --retry 4 --retry-all-errors --retry-delay 2 https://www.gutenberg.org/cache/epub/41/pg41.txt --output .build/sleepy-hollow/master.txt
          sha256sum .build/sleepy-hollow/master.txt | tee .build/sleepy-hollow/master.sha256
      - name: Verify identity and boundaries
        run: |
          grep -Fq 'The Project Gutenberg eBook of The Legend of Sleepy Hollow' .build/sleepy-hollow/master.txt
          grep -Fq 'Author: Washington Irving' .build/sleepy-hollow/master.txt
          grep -Fq 'Release date: June 27, 2008 [eBook #41]' .build/sleepy-hollow/master.txt
          grep -Fq 'Most recently updated: February 10, 2026' .build/sleepy-hollow/master.txt
          grep -Fq '*** START OF THE PROJECT GUTENBERG EBOOK THE LEGEND OF SLEEPY HOLLOW ***' .build/sleepy-hollow/master.txt
          grep -Fq '*** END OF THE PROJECT GUTENBERG EBOOK THE LEGEND OF SLEEPY HOLLOW ***' .build/sleepy-hollow/master.txt
      - name: Make working copy of story body
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('.build/sleepy-hollow/master.txt').read_text(encoding='utf-8-sig')
          start='*** START OF THE PROJECT GUTENBERG EBOOK THE LEGEND OF SLEEPY HOLLOW ***'
          end='*** END OF THE PROJECT GUTENBERG EBOOK THE LEGEND OF SLEEPY HOLLOW ***'
          body=text.split(start,1)[1].split(end,1)[0].strip()+"\n"
          Path('.build/sleepy-hollow/working.txt').write_text(body,encoding='utf-8')
          PY
          test -s .build/sleepy-hollow/working.txt
      - name: Detect route pool marry and issue verification passports
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { candidateTokenResultFor } from './function-lane/core/candidate_tokens.mjs';
          import { cleanCandidateTokens } from './function-lane/core/candidate_cleaner.mjs';
          import { meaningFit } from './function-lane/core/meaning_fit.mjs';
          import { batchByFunction } from './function-lane/core/function_batcher.mjs';
          import { routeEvidence } from './function-lane/core/evidence_router.mjs';
          import { addEvidence } from './function-lane/core/evidence_pool.mjs';
          import { marryEvidence } from './function-lane/core/evidence_marriage.mjs';
          import { verificationGate } from './function-lane/core/verification_gate.mjs';

          const text=fs.readFileSync('.build/sleepy-hollow/working.txt','utf8');
          const first=text.split(/\n\s*\n/).slice(0,8).join('\n\n');
          const detected=candidateTokenResultFor(first);
          const cleaned=cleanCandidateTokens(detected.candidateTokens);
          const glossaryParcels=(cleaned.candidateCleaner.wordCandidates ?? []).map(({value}) => meaningFit({term:value,context:first,candidateMeanings:[]}).meaningFit);
          const namedParcels=(cleaned.candidateCleaner.namedReferences ?? []).filter((x)=>x.bucket!=='reject').map(({value}) => meaningFit({term:value,context:first,candidateMeanings:[]}).meaningFit);
          const parcels=[...glossaryParcels,...namedParcels];
          const batched=batchByFunction({glossaryParcels,namedParcels});
          const evidenceRoutes=parcels.map((parcel)=>routeEvidence(parcel).evidenceRoute);

          // At this stage no external evidence has returned yet. The pool is intentionally empty.
          // Every parcel gets a marriage record showing that no evidence has yet been matched.
          const evidencePool=[];
          const marriages=parcels.map((parcel)=>marryEvidence({parcel,evidence:{},claimSupport:'pending',contextFit:'pending'}).marriage);
          const verificationPassports=parcels.map((parcel)=>verificationGate({claim:`Contextual function/meaning of ${parcel.term}`,sources:[],contextFit:'pending',contradictionCheck:'pending'}).verification);
          const passportStates={};
          for (const p of verificationPassports) passportStates[p.state]=(passportStates[p.state]??0)+1;
          const marriageStates={};
          for (const m of marriages) marriageStates[m.state]=(marriageStates[m.state]??0)+1;

          fs.writeFileSync('.build/sleepy-hollow/first-candidates.json',JSON.stringify(detected,null,2));
          fs.writeFileSync('.build/sleepy-hollow/first-cleaned.json',JSON.stringify(cleaned,null,2));
          fs.writeFileSync('.build/sleepy-hollow/first-meaning-fit-parcels.json',JSON.stringify({glossaryParcels,namedParcels},null,2));
          fs.writeFileSync('.build/sleepy-hollow/first-function-batches.json',JSON.stringify(batched,null,2));
          fs.writeFileSync('.build/sleepy-hollow/first-evidence-routes.json',JSON.stringify({evidenceRoutes},null,2));
          fs.writeFileSync('.build/sleepy-hollow/first-evidence-pool.json',JSON.stringify({evidencePool},null,2));
          fs.writeFileSync('.build/sleepy-hollow/first-evidence-marriages.json',JSON.stringify({marriages,marriageStates},null,2));
          fs.writeFileSync('.build/sleepy-hollow/first-verification-passports.json',JSON.stringify({verificationPassports,passportStates},null,2));
          console.log(JSON.stringify({parcels:parcels.length,evidencePool:evidencePool.length,marriageStates,passportStates},null,2));
          NODE
      - name: Preserve Source Gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: sleepy-hollow-source-gate
          path: .build/sleepy-hollow/
          retention-days: 90
