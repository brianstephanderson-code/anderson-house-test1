name: Build Three Amigos Device Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "android/amigos-device-agent/**"
      - ".github/workflows/amigos-device-agent-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/amigos-device-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: three-amigos-device-agent-debug
          path: android/amigos-device-agent/app/build/outputs/apk/debug/app-debug.apk
