name: Build Three Amigos Device Agent

on:
  workflow_dispatch:
  push:
    paths:
      - "android/amigos-device-agent/**"
      - ".github/workflows/amigos-device-agent-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/amigos-device-agent
    env:
      AMIGOS_KEYSTORE_B64: ${{ secrets.AMIGOS_KEYSTORE_B64 }}
      AMIGOS_STORE_PASSWORD: ${{ secrets.AMIGOS_STORE_PASSWORD }}
      AMIGOS_KEY_PASSWORD: ${{ secrets.AMIGOS_KEY_PASSWORD }}
      AMIGOS_KEY_ALIAS: ${{ secrets.AMIGOS_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch pinned wake-word dependencies
        run: bash tools/fetch_wake_deps.sh

      - name: Restore stable signing keystore
        if: ${{ env.AMIGOS_KEYSTORE_B64 != '' }}
        run: |
          printf '%s' "$AMIGOS_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/amigos-signing.p12"

      - name: Build stably signed APK
        if: ${{ env.AMIGOS_KEYSTORE_B64 != '' }}
        env:
          AMIGOS_KEYSTORE_PATH: ${{ runner.temp }}/amigos-signing.p12
        run: gradle --no-daemon assembleRelease

      - name: Build temporary debug APK
        if: ${{ env.AMIGOS_KEYSTORE_B64 == '' }}
        run: gradle --no-daemon assembleDebug

      - name: Stage APK
        run: |
          mkdir -p "$RUNNER_TEMP/amigos-apk"
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/amigos-apk/three-amigos-device-agent.apk"
            echo "SIGNED_BUILD=YES" >> "$GITHUB_ENV"
          else
            cp app/build/outputs/apk/debug/app-debug.apk "$RUNNER_TEMP/amigos-apk/three-amigos-device-agent.apk"
            echo "SIGNED_BUILD=NO" >> "$GITHUB_ENV"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: three-amigos-device-agent
          path: ${{ runner.temp }}/amigos-apk/three-amigos-device-agent.apk
