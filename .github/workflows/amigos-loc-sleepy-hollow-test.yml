name: Amigos LOC Sleepy Hollow Test

on:
  push:
    paths:
      - ".github/workflows/amigos-loc-sleepy-hollow-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loc-test:
    runs-on: ubuntu-latest
    steps:
      - name: Recast through LOC specialist door
        run: |
          for QUESTION in             "Legend Sleepy Hollow Irving"             "Sketch Book Geoffrey Crayon Irving"             "Sketch Book Irving 1820"             "Irving Van Winkle Sketch Book"
          do
            BODY="$(curl --fail --silent --show-error --get               --data-urlencode 'type=SEARCH_DISCOVER_LOC'               --data-urlencode "query=$QUESTION"               --data-urlencode 'limit=10'               'https://ah-word-count.brian-steph-anderson.workers.dev')"
            echo "QUERY=$QUESTION"
            echo "BODY=$BODY"
          done
