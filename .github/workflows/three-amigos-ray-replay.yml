name: Three Amigos Ray atomic capacity replay
on:
  push:
    paths:
      - '.github/workflows/three-amigos-ray-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ray-replay:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Install Ray
        run: python -m pip install --disable-pip-version-check 'ray==2.50.1'
      - name: Discover reserve execute verify release
        shell: bash
        run: |
          python - <<'PY'
          import json, time
          import ray
          from ray.util.placement_group import placement_group, placement_group_table, remove_placement_group
          from ray.util.scheduling_strategies import PlacementGroupSchedulingStrategy
          ray.init(num_cpus=2, include_dashboard=False, log_to_driver=False)
          available = ray.available_resources()
          assert available.get("CPU", 0) >= 1, available
          pg = placement_group([{"CPU": 1}], strategy="STRICT_PACK")
          ray.get(pg.ready(), timeout=60)
          assert placement_group_table(pg)["state"] == "CREATED"
          @ray.remote(num_cpus=1)
          def transform(value):
              return {"before": value, "after": value * 2}
          result = ray.get(transform.options(scheduling_strategy=PlacementGroupSchedulingStrategy(placement_group=pg)).remote(21), timeout=60)
          assert result == {"before": 21, "after": 42}, result
          remove_placement_group(pg)
          for _ in range(30):
              if placement_group_table(pg)["state"] == "REMOVED":
                  break
              time.sleep(1)
          assert placement_group_table(pg)["state"] == "REMOVED"
          print(json.dumps({"status":"GREEN","available_before":available,"reservation":"CREATED","result":result,"release":"REMOVED"}))
          ray.shutdown()
          PY
