name: Google Enable Vertex AI

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/google-enable-vertex-ai.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate Google
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3

      - name: Enable Vertex AI API
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail
          gcloud services enable aiplatform.googleapis.com --project "$PROJECT_ID"
          STATE="$(gcloud services list --enabled --project "$PROJECT_ID" --filter='config.name:aiplatform.googleapis.com' --format='value(config.name)')"
          test "$STATE" = "aiplatform.googleapis.com"
          echo "VERTEX_AI_API_ENABLED"
