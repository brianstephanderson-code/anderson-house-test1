name: Three Amigos Vexy Production

on:
  push:
    paths:
      - 'books/sleepy-hollow/art/master/ichabod_crane_faces_the_headless_horseman.jpg'
      - 'books/sleepy-hollow/art/vexy/JOB-ICHABOD-001.json'
      - 'tomo_bridge/vexy/run_asset.py'
      - '.github/workflows/vexy-production.yml'
  workflow_dispatch:
    inputs:
      source_path:
        description: Repository path to approved source image
        required: true
        default: books/sleepy-hollow/art/master/ichabod_crane_faces_the_headless_horseman.jpg
      job_id:
        description: Warehouse job id
        required: true
        default: ichabod-001

permissions:
  contents: write

jobs:
  vexy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_PATH: ${{ github.event.inputs.source_path || 'books/sleepy-hollow/art/master/ichabod_crane_faces_the_headless_horseman.jpg' }}
      JOB_ID: ${{ github.event.inputs.job_id || 'ichabod-001' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify approved source exists
        run: test -f "$SOURCE_PATH"

      - name: Install Vexy bridge dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow playwright
          python -m playwright install --with-deps chromium

      - name: Pass approved asset through Vexy
        run: |
          python tomo_bridge/vexy/run_asset.py \
            "$SOURCE_PATH" \
            "books/sleepy-hollow/art/vexy/out/$JOB_ID"

      - name: Warehouse Vexy output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add books/sleepy-hollow/art/vexy/out
          if ! git diff --cached --quiet; then
            git commit -m "Warehouse Vexy output $JOB_ID [skip ci]"
            git push
          fi

      - name: Upload inspection artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vexy-${{ env.JOB_ID }}
          path: books/sleepy-hollow/art/vexy/out/${{ env.JOB_ID }}/
          if-no-files-found: warn
