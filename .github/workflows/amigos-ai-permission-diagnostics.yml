name: Amigos AI Permission Diagnostics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/amigos-ai-permission-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  google-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Authenticate Google
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v3
      - name: Read Google permission state
        env:
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          echo "ACCOUNT=$(gcloud config get-value account 2>/dev/null || true)"
          echo "PROJECT=$PROJECT_ID"
          echo "SERVICE_ACCOUNT=$SERVICE_ACCOUNT"
          echo "AIPLATFORM_ENABLED=$(gcloud services list --enabled --project "$PROJECT_ID" --filter='name:aiplatform.googleapis.com' --format='value(name)' 2>/dev/null || true)"
          echo "IAM_BINDINGS_FOR_SERVICE_ACCOUNT"
          gcloud projects get-iam-policy "$PROJECT_ID"             --flatten='bindings[].members'             --filter="bindings.members:serviceAccount:$SERVICE_ACCOUNT"             --format='table(bindings.role,bindings.members)' || true

  aws-permissions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}
      - name: Read AWS permission state
        env:
          ROLE_ARN: ${{ vars.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail
          ROLE_NAME="${ROLE_ARN##*/}"
          echo "CALLER=$(aws sts get-caller-identity --query Arn --output text)"
          echo "ROLE_NAME=$ROLE_NAME"
          echo "ATTACHED_POLICIES"
          aws iam list-attached-role-policies --role-name "$ROLE_NAME" || true
          echo "INLINE_POLICY_NAMES"
          NAMES="$(aws iam list-role-policies --role-name "$ROLE_NAME" --query 'PolicyNames[]' --output text 2>/dev/null || true)"
          echo "$NAMES"
          for NAME in $NAMES; do
            echo "INLINE_POLICY=$NAME"
            aws iam get-role-policy --role-name "$ROLE_NAME" --policy-name "$NAME" || true
          done
