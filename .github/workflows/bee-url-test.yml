name: Bee URL Proof Flight
on:
  push:
    paths:
      - '.github/workflows/bee-url-test.yml'
  workflow_dispatch:
jobs:
  bee:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Retrieve source and record evidence
        id: retrieval
        run: |
          mkdir -p warehouse/bee-flights
          python - <<'PY'
          import json, urllib.request, datetime, traceback, pathlib, sys
          url='https://api.crossref.org/works?query.title=A%20Tale%20of%20Two%20Cities&rows=1'
          report={'flight':'001','url':url,'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'status':'RED'}
          try:
              req=urllib.request.Request(url,headers={'User-Agent':'ThreeAmigosBeeProof/0.1 (research proof)'})
              with urllib.request.urlopen(req,timeout=15) as response:
                  data=json.load(response)
                  items=data['message']['items']
                  report.update(http_status=response.status,records=len(items),first_title=items[0].get('title',[]) if items else [],status='GREEN' if response.status==200 and items else 'RED')
          except Exception as e:
              report['error']=str(e)
          pathlib.Path('warehouse/bee-flights/flight-001-latest.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          if report['status']!='GREEN': sys.exit(1)
          PY
      - name: Commit evidence to warehouse even on retrieval failure
        if: always()
        run: |
          git config user.name 'three-amigos-bee[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add warehouse/bee-flights/flight-001-latest.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record bee flight 001 retrieval evidence'
            git push
          fi
